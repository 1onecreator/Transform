name: Build macOS app
on: workflow_dispatch

jobs:
  build-macos:
    runs-on: macos-14   # Apple Silicon；如要 Intel 改成 macos-13 并再加一个 job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # 如有依赖： pip install -r requirements.txt
      - name: Build .app
        run: |
          pyinstaller transform.py --name Transform --windowed --onefile \
            --add-data "configs/config.yaml:configs" \
            --add-data "assets/logo.png:assets"
      - uses: actions/upload-artifact@v4
        with:
          name: Transform.app
          path: dist/Transform.app

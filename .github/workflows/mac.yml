name: Build macOS app
on: workflow_dispatch

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build .app
        run: |
          rm -f transform.spec
          ls -R
          pyinstaller transform.py --name Transform --windowed --onedir
          # 如果有资源，用下面这种写法（macOS 用冒号:）
          # pyinstaller transform.py --name Transform --windowed --onedir \
          #   --add-data "configs:configs" \
          #   --add-data "assets:assets"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Transform.app
          path: dist/Transform.app
